name: Broadbus Technologies
description: Broadbus Technologies was a video-on-demand (VOD) streaming infrastructure company based in
  Boxborough, Massachusetts. It developed RAM-based VOD streaming server technology (the B-1 server) used by
  cable operators to deliver on-demand video at scale. The company was acquired by Motorola in 2006 and folded
  into Motorola's Connected Home / cable video business. It was surfaced as a portfolio company of Battery
  Ventures and added to the API Evangelist network as a stub. As a defunct hardware and infrastructure vendor
  with no surviving corporate or developer presence, it exposes no public API, developer portal, documentation,
  or discoverable web surface to enrich.
